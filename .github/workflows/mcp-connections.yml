name: MCP connection security

on:
  pull_request:
    paths:
      - "api/agent_platform/mcp_*"
      - "api/agent_platform/personal_bridge.py"
      - "api/agent_platform/personal_goal_tools.py"
      - "api/agent_platform/personal_wake.py"
      - "api/agent_platform/migrations/20261122_mcp_connections.sql"
      - "api/agent_platform/migrations/20261122_personal_mcp_goal_selections.sql"
      - "api/tests/test_mcp_connections.py"
      - "api/tests/test_mcp_connections_postgres.py"
      - "api/tests/test_mcp_schedule_selection.py"
      - "api/requirements.txt"
      - ".github/workflows/mcp-connections.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install security and official MCP adapter dependencies
        run: |
          python -m pip install "pytest>=8,<10" "authlib>=1.6,<2" \
            "cryptography>=44,<50" "httpx>=0.27,<1" "fastapi>=0.115,<1" \
            "asyncpg>=0.30,<1" "langchain-mcp-adapters>=0.3,<0.4" \
            "jsonschema>=4.22,<5"
      - name: Compile connection and scheduling code
        run: |
          python -m compileall -q api/agent_platform/mcp_connections.py \
            api/agent_platform/mcp_connection_http.py \
            api/agent_platform/mcp_managed_catalog.py \
            api/agent_platform/personal_bridge.py \
            api/agent_platform/personal_wake.py \
            api/agent_platform/personal_goal_tools.py
      - name: Offline protocol, crypto and isolation tests
        run: |
          python -m pytest -q api/tests/test_mcp_connections.py \
            api/tests/test_mcp_schedule_selection.py \
            api/tests/test_mcp_broker.py api/tests/test_universal_mcp_catalog.py

  postgres-lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mcp_test
          POSTGRES_PASSWORD: isolated_test_only
          POSTGRES_DB: mcp_security_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mcp_test -d mcp_security_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 8
    env:
      MCP_TEST_DATABASE_URL: postgresql://mcp_test:isolated_test_only@localhost:5432/mcp_security_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test-only OAuth and MCP SDK dependencies
        run: |
          python -m pip install "pytest>=8,<10" "authlib>=1.6,<2" \
            "cryptography>=44,<50" "httpx>=0.27,<1" "fastapi>=0.115,<1" \
            "asyncpg>=0.30,<1" "langchain-mcp-adapters>=0.3,<0.4" \
            "jsonschema>=4.22,<5"
      - name: Real PostgreSQL OAuth connection and two-provider integration
        run: python -m pytest -q api/tests/test_mcp_connections_postgres.py
