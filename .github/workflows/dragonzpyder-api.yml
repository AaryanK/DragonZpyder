name: DragonZpyder API
on:
  push:
    branches: [codex/consolidate-dragonzpyder-web, codex/python-fastapi-migration]
    paths: ["api/**", ".github/workflows/dragonzpyder-api.yml"]
  pull_request:
    paths: ["api/**", ".github/workflows/dragonzpyder-api.yml"]
jobs:
  fastapi-contract:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install FastAPI and tests
        run: pip install -r api/requirements.txt pytest
      - name: Validate Python source
        run: python -m compileall -q api/main.py api/provider_gateway.py api/usage_ledger.py api/observability.py api/agent_platform api/tests
      - name: Run FastAPI contract checks
        run: pytest -q api/tests/test_fastapi_gateway.py api/tests/test_usage_audit.py api/tests/test_provider_gateway.py api/tests/test_agent_platform_contract.py api/tests/test_agent_gateway_protocol.py api/tests/test_workflow_hub_router.py
  agent-stack-imports:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install opt-in agent dependencies
        run: pip install -r api/requirements-agent.txt pytest
      - name: Verify SDK imports without calling paid models
        working-directory: api
        run: |
          python -c "from deepagents import create_deep_agent; from langchain_openrouter import ChatOpenRouter; from langgraph.checkpoint.postgres.aio import AsyncPostgresSaver; from langfuse.langchain import CallbackHandler; from hatchet_sdk import Hatchet; from mem0 import Memory; from agent_platform.runtime import AgentRuntime; from agent_platform.worker import main; print('agent stack imports OK')"
          python -m agent_platform.ops_benchmark
          python -m agent_platform.frontier_stress
          pytest -q tests/test_agent_platform_contract.py tests/test_staging_lab.py tests/test_agent_stack_integration.py tests/test_harness_v2.py tests/test_agent_evaluation.py tests/test_agent_web_monitor.py tests/test_ops_benchmark.py tests/test_frontier_stress.py tests/test_orchestration.py tests/test_model_capabilities.py tests/test_artifact_evidence.py tests/test_budget_reservations.py tests/test_progress_guard.py tests/test_frontier_batch.py tests/test_key_budget.py tests/test_scientific_oracles.py tests/test_provider_pacing.py tests/test_gateway_parent_budget.py tests/test_sandbox_math.py tests/test_workflow_core.py tests/test_capability_hub.py ../api/agent_platform/tests/test_operly_harness_migration.py
  budget-postgres-integration:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: budget_test
          POSTGRES_PASSWORD: disposable_ci_only
          POSTGRES_DB: budget_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U budget_test -d budget_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DRAGONZPYDER_BUDGET_TEST_DSN: postgresql://budget_test:disposable_ci_only@localhost:5432/budget_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test-only dependencies
        run: pip install asyncpg pytest
      - name: Verify real PostgreSQL concurrency, restart and isolation
        run: pytest -q api/tests/test_budget_postgres_integration.py

  personal-core-contracts:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install optional personal core dependencies
        run: pip install -r api/requirements-personal.txt pytest
      - name: Compile personal service and test contracts
        run: |
          python -m compileall -q api/personal_core api/main.py api/tests/test_personal_core.py
          pytest -q api/tests/test_personal_core.py
  legacy-compatibility:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
