[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dragonzpyder"
version = "0.1.0"
description = "Thin personal client for Operly's governed runtime"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
dragonzpyder = "dragonzpyder.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
