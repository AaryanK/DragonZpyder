plugins { id 'com.android.application' }
android {
    namespace 'xyz.dragonzpyder.android'
    compileSdk 35
    defaultConfig {
        applicationId 'xyz.dragonzpyder.android'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
