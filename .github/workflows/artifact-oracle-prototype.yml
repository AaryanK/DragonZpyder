name: Artifact oracle and receipt prototype checks

on:
  push:
    branches:
      - codex/trusted-artifact-oracle-prototype-20261112
    paths:
      - 'api/agent_platform/evals/outcome_oracle_prototype.py'
      - 'api/agent_platform/evals/trusted_receipt_prototype.py'
      - 'api/agent_platform/evals/transactional_outcome_prototype.py'
      - 'api/tests/test_outcome_oracle_prototype.py'
      - 'api/tests/test_outcome_oracle_bounds.py'
      - 'api/tests/test_trusted_receipt_prototype.py'
      - 'api/tests/test_transactional_outcome_prototype.py'
      - '.github/workflows/artifact-oracle-prototype.yml'
  pull_request:
    paths:
      - 'api/agent_platform/evals/outcome_oracle_prototype.py'
      - 'api/agent_platform/evals/trusted_receipt_prototype.py'
      - 'api/agent_platform/evals/transactional_outcome_prototype.py'
      - 'api/tests/test_outcome_oracle_prototype.py'
      - 'api/tests/test_outcome_oracle_bounds.py'
      - 'api/tests/test_trusted_receipt_prototype.py'
      - 'api/tests/test_transactional_outcome_prototype.py'
      - '.github/workflows/artifact-oracle-prototype.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  artifact-oracle:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile isolated verifiers
        run: python -m py_compile api/agent_platform/evals/outcome_oracle_prototype.py api/agent_platform/evals/trusted_receipt_prototype.py api/agent_platform/evals/transactional_outcome_prototype.py
      - name: Run artifact oracle regression suite
        working-directory: api
        run: python -m unittest discover -s tests -p 'test_outcome_oracle*.py' -v
      - name: Run authenticated receipt security suite
        env:
          PYTHONPATH: '.:api'
        run: python -m unittest discover -s api/tests -p 'test_trusted_receipt_prototype.py' -v
      - name: Run transactional outcome regression suite
        env:
          PYTHONPATH: '.:api'
        run: python -m unittest discover -s api/tests -p 'test_transactional_outcome_prototype.py' -v
