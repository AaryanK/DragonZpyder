name: DragonZpyder Web

on:
  pull_request:
    paths:
      - "web/**"
      - ".github/workflows/web.yml"
  push:
    branches: [master, main, codex/python-fastapi-migration]
    paths:
      - "web/**"
      - ".github/workflows/web.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check JavaScript syntax
        working-directory: web
        run: |
          node --check app.js
          node --check home.js
          node --check script.js
          node --check server.mjs
      - name: Guard governed frontend boundary
        run: |
          ! grep -RniE 'proxy\.runpod\.net|Bearer EMPTY|/v1/chat/completions' -- web
          # The Personal client may use the direct chat adapter or the retry-safe submit adapter.
          grep -Eq '/api/personal-agent/chat|/api/personal-tools/client/submit' web/app.js
          grep -q '/api/personal-agent/chat' web/app.js
          grep -q '/api/auth/personal-scope' web/app.js
          grep -q '/api/personal-tools/approvals' web/app.js
          grep -q 'https://operly.dragonzpyder.xyz' web/server.mjs
      - name: Check required web root
        run: |
          test -s web/index.html
          test -s web/app.html
          test -s web/app.css
          test -s web/app.js
          test -s web/package.json
          test -s web/server.mjs
          test -s web/privacy.html
          test -s web/terms.html
      - name: Smoke test Railway server
        working-directory: web
        run: |
          PORT=4173 node server.mjs > /tmp/dragonzpyder-web.log 2>&1 &
          pid=$!
          trap 'kill $pid' EXIT
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:4173/healthz >/tmp/health.json; then break; fi
            sleep 0.25
          done
          grep -q '"status":"ok"' /tmp/health.json
          curl -fsS http://127.0.0.1:4173/ | grep -q 'DragonZpyder'
          curl -fsS http://127.0.0.1:4173/app.html | grep -q 'Personal AI'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:4173/server.mjs)" = "404"

  fastapi-web:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r web/requirements.txt pytest
      - run: python -m compileall -q web/main.py web/backend web/tests
      - run: pytest -q web/tests/test_fastapi_web.py
