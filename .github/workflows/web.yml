name: DragonZpyder Web

on:
  pull_request:
    paths:
      - "web/**"
      - ".github/workflows/web.yml"
  push:
    branches: [master, main]
    paths:
      - "web/**"
      - ".github/workflows/web.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check JavaScript syntax
        working-directory: web
        run: |
          node --check app.js
          node --check home.js
          node --check script.js
          node --check 'api/[...path].js'
      - name: Guard governed frontend boundary
        run: |
          ! grep -RniE 'proxy\.runpod\.net|Bearer EMPTY|/v1/chat/completions' -- web
          grep -q '/api/personal-tools/client/submit' web/app.js
          grep -q '/api/personal-agent/chat' web/app.js
          grep -q '/api/auth/personal-scope' web/app.js
          grep -q '/api/personal-tools/approvals' web/app.js
          grep -q 'https://operly.dragonzpyder.xyz' 'web/api/[...path].js'
      - name: Check required web root
        run: |
          test -s web/index.html
          test -s web/app.html
          test -s web/app.css
          test -s web/app.js
          test -s 'web/api/[...path].js'
          test -s web/privacy.html
          test -s web/terms.html
