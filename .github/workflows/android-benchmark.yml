name: Android Benchmark Contract
on:
  pull_request:
    paths: ["android/**", ".github/workflows/android-benchmark.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-benchmark-${{ github.ref }}
  cancel-in-progress: true
jobs:
  benchmark-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - run: bash android/prepare-brand.sh
      - name: Compile non-debuggable benchmark target and benchmark instrumentation
        working-directory: android
        run: gradle --no-daemon -PdzBenchmark :app:assembleBenchmark :benchmark:assembleBenchmark
      - name: Assert benchmark package is isolated from the actual app
        run: |
          set -euo pipefail
          apk=$(find android/app/build/outputs/apk/benchmark -name '*.apk' -print -quit)
          test -f "$apk"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$apk" | grep "package: name='xyz.dragonzpyder.android.benchmark'"
      - name: Record scope
        run: echo 'Build contract only. Performance thresholds require physical-device Macrobenchmark data.'
