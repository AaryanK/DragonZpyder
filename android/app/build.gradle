plugins { id 'com.android.application'; id 'org.jetbrains.kotlin.android'; id 'org.jetbrains.kotlin.plugin.compose' }
android {
    namespace 'xyz.dragonzpyder.android'
    compileSdk 36
    buildFeatures { compose true }
    kotlinOptions { jvmTarget = '17' }
    defaultConfig {
        applicationId 'xyz.dragonzpyder.android'
        minSdk 26
        targetSdk 36
        versionCode 12
        versionName '0.9.0-beta.1'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    def releaseKeystore = System.getenv("DZ_ANDROID_KEYSTORE")
    def releaseStorePassword = System.getenv("DZ_ANDROID_STORE_PASSWORD")
    def releaseKeyAlias = System.getenv("DZ_ANDROID_KEY_ALIAS")
    def releaseKeyPassword = System.getenv("DZ_ANDROID_KEY_PASSWORD")
    def hasReleaseSigning = [releaseKeystore, releaseStorePassword, releaseKeyAlias, releaseKeyPassword].every { it != null && !it.isEmpty() }
    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile file(releaseKeystore)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }
    buildTypes {
        release {
            if (hasReleaseSigning) signingConfig signingConfigs.release
            debuggable false
        }
    }
    if (gradle.startParameter.taskNames.any { it.toLowerCase().contains("release") && (it.toLowerCase().contains("assemble") || it.toLowerCase().contains("bundle")) } && !hasReleaseSigning) {
        throw new GradleException("Release signing credentials must be supplied through the authorized secure environment.")
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}


dependencies {
    implementation 'androidx.activity:activity:1.9.3'
    implementation platform('androidx.compose:compose-bom:2025.01.01')
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.credentials:credentials:1.6.0'
    implementation 'androidx.credentials:credentials-play-services-auth:1.6.0'
    implementation 'com.google.android.libraries.identity.googleid:googleid:1.2.1'
    implementation 'androidx.browser:browser:1.8.0'
    implementation 'org.commonmark:commonmark:0.32.0'
    implementation 'org.commonmark:commonmark-ext-gfm-tables:0.32.0'
    implementation 'org.commonmark:commonmark-ext-gfm-strikethrough:0.32.0'
    implementation 'org.commonmark:commonmark-ext-autolink:0.32.0'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation platform('androidx.compose:compose-bom:2025.01.01')
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test:core:1.6.1'
}
