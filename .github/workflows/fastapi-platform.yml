name: DragonZpyder FastAPI platform
on:
  pull_request:
    paths:
      - "platform_api/**"
      - ".github/workflows/fastapi-platform.yml"
  push:
    paths:
      - "platform_api/**"
      - ".github/workflows/fastapi-platform.yml"
jobs:
  platform-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform_api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt httpx
      - run: python -m unittest discover -s tests -v
